name: CI

# Lint gate for every pull request: clippy over the whole Rust workspace (it type-checks
# without building binaries) plus pr-title.yml. Nothing is compiled into an app here: both
# apps are built once, by release.yml on main, and the pull request template asks for a local
# build of each before a PR is opened.
#
# `rust` and `pr-title` are required status checks on dev and main (the "mothr checks" repo
# ruleset). Job names are the check names: rename them only together with the ruleset.
# `windows` lints the same workspace for Windows and compiles the installer script, both of which
# the release builds too. It's slow (~5 min), so it only runs on pull requests into main (the dev
# -> main merge), not on every feature PR into dev. It isn't required; a red one means the next
# release's Windows build will fail. `macos` does the same for macOS (clippy, and packaging
# Mothr.app and its disk image with a stand-in binary). Both also run when CI is started by hand
# on a branch (Actions → CI → Run workflow), to check a platform before the dev -> main PR.
# Don't add path filters: a required check that never runs stays pending and blocks the merge.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # Cargo.toml optimizes the dev profile, every dependency at opt-level 3, so the app runs
      # well from debug builds. Clippy still fully compiles build scripts and proc-macros
      # (serde_derive, syn, GPUI's macros…), and at opt-level 3 that triples the run (measured
      # 8m14s vs 2m54s). Linting doesn't need any of it.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # GPUI's build scripts look these up (same list as release.yml).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Reused by later pushes to the same pull request.
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked --config 'profile.dev.package."*".opt-level=0' -- -D warnings

  # Same lint for the Windows target: the cfg(windows) code paths only compile here. Only for
  # pull requests into main; on the others this job is skipped.
  windows:
    name: windows
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-windows

      # bash, so the quoted --config reaches cargo as it does on Linux (PowerShell mangles it).
      - name: clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked --config 'profile.dev.package."*".opt-level=0' -- -D warnings

      # The installer script compiles (with placeholder files; the release packs the real ones).
      - name: installer
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "mothr_0.0.0_windows_x64"
          New-Item -ItemType Directory -Force "$src\licenses" | Out-Null
          foreach ($f in "mothr.exe", "LICENSE.txt", "licenses\OFL-Geist.txt") { Set-Content (Join-Path $src $f) "placeholder" }
          ./apps/desktop/windows/build-installer.ps1 -Version 0.0.0 -Source $src -OutDir $env:RUNNER_TEMP

  # Same lint for macOS (Apple silicon), and the app bundle and disk image build. Only for pull
  # requests into main (or by hand); on the others this job is skipped.
  macos:
    name: macos
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-macos

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked --config 'profile.dev.package."*".opt-level=0' -- -D warnings

      # bundle.sh signs, lints Info.plist and makes the disk image; a tiny binary stands in for
      # the app (the release builds the real one).
      - name: bundle
        run: |
          echo 'int main(void) { return 0; }' | cc -x c - -o "$RUNNER_TEMP/mothr"
          apps/desktop/macos/bundle.sh 0.0.0 arm64 "$RUNNER_TEMP/mothr" "$RUNNER_TEMP/out"
          hdiutil imageinfo "$RUNNER_TEMP/out/mothr_0.0.0_macos_arm64.dmg" >/dev/null
          tar -tzf "$RUNNER_TEMP/out/mothr_0.0.0_macos_arm64.tar.gz"

  # TEMPORARY (dropped before the PR): a real macOS build, installed with install.sh, launched,
  # and updated in the app from a mock release.
  macos-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-macos-${{ matrix.arch }}
      - name: Build
        run: cargo build --release --locked -p mothr-app --target ${{ matrix.target }}
      - name: Package two versions and serve them
        run: |
          set -x
          BIN=target/${{ matrix.target }}/release/mothr
          lipo -info "$BIN"
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION | head -6
          R=$RUNNER_TEMP/rel
          # The first release is the binary's own version, as in a real release.
          V0=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "V0=$V0" >> $GITHUB_ENV
          for v in $V0 0.2.1; do
            mkdir -p $R/$v
            apps/desktop/macos/bundle.sh $v ${{ matrix.arch }} "$BIN" $R/$v
            (cd $R/$v && shasum -a 256 -- * > SHA256SUMS && cat SHA256SUMS)
          done
          echo 0.2.1 > $R/latest
          nohup python3 -I .agents/skills/release/scripts/mock-releases.py $R 8799 > $RUNNER_TEMP/mock.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8799/api/releases/latest
          hdiutil attach -nobrowse -readonly $R/$V0/mothr_${V0}_macos_${{ matrix.arch }}.dmg
          ls -la /Volumes/Mothr
          hdiutil detach /Volumes/Mothr
      - name: Rosetta
        if: matrix.arch == 'x64'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true && echo "rosetta ok"
      - name: install.sh (system bash 3.2)
        run: |
          set -x
          /bin/bash --version | head -1
          H=$RUNNER_TEMP/home; mkdir -p $H
          if [ "${{ matrix.arch }}" = x64 ]; then
            # From a Rosetta shell on Apple silicon install.sh must still pick arm64; force x64 with a shim.
            mkdir -p $RUNNER_TEMP/shim
            printf '#!/bin/sh\ncase "$*" in *hw.optional.arm64*) echo 0 ;; *) exec /usr/sbin/sysctl "$@" ;; esac\n' > $RUNNER_TEMP/shim/sysctl
            chmod +x $RUNNER_TEMP/shim/sysctl
            # This mock release only has the x64 build, so picking arm64 shows as a failed download.
            out="$(env HOME=$H MOTHR_RELEASES_URL=http://127.0.0.1:8799/releases arch -x86_64 /bin/bash install.sh --version $V0 --dir $RUNNER_TEMP/rosetta-check 2>&1 || true)"
            echo "$out"
            echo "$out" | grep -q "for macOS on Apple silicon"
            env PATH="$RUNNER_TEMP/shim:$PATH" HOME=$H MOTHR_RELEASES_URL=http://127.0.0.1:8799/releases arch -x86_64 /bin/bash install.sh --version $V0
          else
            env HOME=$H MOTHR_RELEASES_URL=http://127.0.0.1:8799/releases /bin/bash install.sh --version $V0
          fi
          lipo -info $H/Applications/Mothr.app/Contents/MacOS/mothr
          ls -la $H/Applications $H/.local/bin
          codesign --verify --strict --verbose=2 $H/Applications/Mothr.app
          codesign -dv $H/Applications/Mothr.app 2>&1 | head -8
          xattr -lr $H/Applications/Mothr.app | head
      - name: Launch and update in the app
        run: |
          set -x
          H=$RUNNER_TEMP/home M=$RUNNER_TEMP/mothr-home S=$RUNNER_TEMP/shots
          mkdir -p $M/config $S
          echo 'auto_update = true' > $M/config/settings.toml
          MOTHR_HOME=$M MOTHR_UPDATE_API=http://127.0.0.1:8799/api $H/.local/bin/mothr > $RUNNER_TEMP/app1.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            grep -q "installed Mothr 0.2.1" $RUNNER_TEMP/app1.log && break
            kill -0 $PID 2>/dev/null || break
            sleep 2
          done
          screencapture -x $S/1-first-start.png || true
          cat $RUNNER_TEMP/app1.log
          grep -A1 CFBundleShortVersionString $H/Applications/Mothr.app/Contents/Info.plist
          ls -la $H/Applications $H/Applications/.mothr-update || true
          kill -0 $PID
          kill $PID; wait $PID || true
          grep -q "installed Mothr 0.2.1" $RUNNER_TEMP/app1.log
          grep -q "<string>0.2.1</string>" $H/Applications/Mothr.app/Contents/Info.plist
      - name: Next start cleans up, and LaunchServices opens the bundle
        run: |
          set -x
          H=$RUNNER_TEMP/home M=$RUNNER_TEMP/mothr-home S=$RUNNER_TEMP/shots
          MOTHR_HOME=$M MOTHR_OPEN=settings MOTHR_UPDATE_API=http://127.0.0.1:8799/api $H/.local/bin/mothr > $RUNNER_TEMP/app2.log 2>&1 &
          PID=$!
          sleep 30
          screencapture -x $S/2-settings-after-update.png || true
          cat $RUNNER_TEMP/app2.log
          ls -la $H/Applications
          test ! -e $H/Applications/.mothr-update
          kill $PID; wait $PID || true
          open $H/Applications/Mothr.app
          sleep 20
          pgrep -fl "Mothr.app/Contents/MacOS/mothr"
          screencapture -x $S/3-opened-by-launchservices.png || true
          osascript -e 'quit app "Mothr"' || pkill -f "Mothr.app/Contents/MacOS/mothr" || true
          # The restart path: the shell the updater runs, after the old process exits.
          sh -c 'while kill -0 "$1" 2>/dev/null; do sleep 0.2; done; if [ -d "$2" ]; then exec open "$2"; else exec "$2"; fi' mothr-restart 999999 $H/Applications/Mothr.app
          sleep 15
          pgrep -fl "Mothr.app/Contents/MacOS/mothr"
          pkill -f "Mothr.app/Contents/MacOS/mothr" || true
      - name: Uninstall
        run: |
          H=$RUNNER_TEMP/home
          env HOME=$H /bin/bash install.sh --uninstall
          ls -A $H/Applications $H/.local/bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/rel/0.2.1/*
          retention-days: 3
