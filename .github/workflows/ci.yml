name: CI

# Lint gate for every pull request: clippy over the whole Rust workspace (it type-checks
# without building binaries) plus pr-title.yml. Feature pull requests don't compile the apps
# here: the pull request template asks for a local build of each before a PR is opened. Release
# and hotfix pull requests into main build every platform (`build`, below).
#
# `rust` and `pr-title` are required status checks on dev and main (the "mothr checks" repo
# ruleset). Job names are the check names: rename them only together with the ruleset.
# `windows` lints the same workspace for Windows and compiles the installer script, both of which
# the release builds too. It's slow (~5 min), so it only runs on pull requests into main (release
# and hotfix pull requests), not on every feature PR into dev. It isn't required; a red one means the next
# release's Windows build will fail. `macos` does the same for macOS (clippy, and packaging
# Mothr.app and its disk image with a stand-in binary). Both also run when CI is started by hand
# on a branch (Actions → CI → Run workflow), to check a platform before preparing a release.
# Don't add path filters: a required check that never runs stays pending and blocks the merge.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # Cargo.toml optimizes the dev profile, every dependency at opt-level 3, so the app runs
      # well from debug builds. Clippy still fully compiles build scripts and proc-macros
      # (serde_derive, syn, GPUI's macros…), and at opt-level 3 that triples the run (measured
      # 8m14s vs 2m54s). Linting doesn't need any of it.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # GPUI's build scripts look these up (same list as release.yml).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Reused by later pushes to the same pull request.
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked --config 'profile.dev.package."*".opt-level=0' -- -D warnings

  # Same lint for the Windows target: the cfg(windows) code paths only compile here. Only for
  # pull requests into main; on the others this job is skipped.
  windows:
    name: windows
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-windows

      # bash, so the quoted --config reaches cargo as it does on Linux (PowerShell mangles it).
      - name: clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked --config 'profile.dev.package."*".opt-level=0' -- -D warnings

      # The installer script compiles (with placeholder files; the release packs the real ones).
      # A dev build's version, the stricter case: its version resource takes only the 0.0.0.
      - name: installer
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "mothr_0.0.0-dev.1_windows_x64"
          New-Item -ItemType Directory -Force "$src\licenses" | Out-Null
          foreach ($f in "mothr.exe", "LICENSE.txt", "licenses\OFL-Geist.txt") { Set-Content (Join-Path $src $f) "placeholder" }
          ./apps/desktop/windows/build-installer.ps1 -Version 0.0.0-dev.1 -Source $src -OutDir $env:RUNNER_TEMP

  # Same lint for macOS (Apple silicon), and the app bundle and disk image build. Only for pull
  # requests into main (or by hand); on the others this job is skipped.
  macos:
    name: macos
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-macos

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked --config 'profile.dev.package."*".opt-level=0' -- -D warnings

      # bundle.sh signs, lints Info.plist and makes the disk image; a tiny binary stands in for
      # the app (the release builds the real one). With a dev build's version, as nightlies have.
      - name: bundle
        run: |
          echo 'int main(void) { return 0; }' | cc -x c - -o "$RUNNER_TEMP/mothr"
          apps/desktop/macos/bundle.sh 0.0.0-dev.1 arm64 "$RUNNER_TEMP/mothr" "$RUNNER_TEMP/out"
          hdiutil imageinfo "$RUNNER_TEMP/out/mothr_0.0.0-dev.1_macos_arm64.dmg" >/dev/null
          tar -tzf "$RUNNER_TEMP/out/mothr_0.0.0-dev.1_macos_arm64.tar.gz"

  # Release and hotfix pull requests into main (prepare-release.yml) build every platform, the
  # same builds the release makes (build.yml): what would ship is known to build before merging.
  # Skipped on every other pull request.
  release-version:
    name: release version
    if: >-
      github.base_ref == 'main' &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

  build:
    needs: release-version
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      version: ${{ needs.release-version.outputs.version }}
    secrets: inherit
