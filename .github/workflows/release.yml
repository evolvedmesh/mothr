name: Release

# Releases what was just merged into main. main only changes through a release or hotfix pull
# request (prepare-release.yml opens them), and those set the version in Cargo.toml, so:
#
# 1. release: if `v<Cargo.toml version>` isn't tagged yet, tag this commit and create a draft
#    GitHub release. Its notes are the "Release notes" section of the merged pull request
#    (edited there before merging); if that's empty, scripts/changes.sh writes them. The tag is
#    annotated with the kind and, for a release, the dev commit it was cut from: the next
#    release counts from there, so release pull requests can be merged or squashed.
# 2. build (build.yml): every platform's files, from the tag.
# 3. publish: attach the files and SHA256SUMS to the draft, then publish it as the latest
#    release. The repo has immutable releases, so nothing can be added after that. If a build
#    fails, the draft stays unpublished: re-run the failed jobs and publish finishes it.
# 4. sync-dev: merge main back into dev, so dev has the new version and tag and the next
#    release branch merges cleanly. If it doesn't merge cleanly, it opens a pull request from
#    sync/main-into-dev-<sha> (a copy of main) into dev, where the conflicts can be resolved.
#    Then it merges main into open release/hotfix branches (a hotfix shipped meanwhile).
#
# Running it again (by hand, or re-running failed jobs) finishes a half-done release: a pushed
# tag or an unpublished draft is picked up where it was left.
#
# A push to main that doesn't change the version (nothing to tag) only runs sync-dev.
# install.sh and the in-app updaters only install files listed in SHA256SUMS.
#
# Secrets:
#   RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY  the evolvedmesh release bot GitHub App: pushes
#                                            the tag (v* tags are protected) and dev's merge
#   ANDROID_KEYSTORE_*                       see build.yml

on:
  push:
    branches:
      - main
  # By hand (Actions → Release → Run workflow, on main): finishes a release an earlier run left
  # half done (tag pushed, or the draft created but not published), from where it stopped.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Picks up where an earlier run stopped: the tag may already be pushed, or the draft
      # created (a failed build, or a run that died). Only a published release is done.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          case "$version" in
            *-*) echo "::error::main's Cargo.toml has a prerelease version ($version)."; exit 1 ;;
          esac
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          tagged=false
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && tagged=true
          if [ "$draft" = false ]; then
            echo "$tag is already released; nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag (tag pushed: $tagged, draft: $draft)"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
          # The commit to release: the tag's, if an earlier run pushed it.
          if [ "$tagged" = true ]; then sha=$(git rev-list -n 1 "$tag"); else sha=$GITHUB_SHA; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        if: steps.version.outputs.released == 'true' && steps.version.outputs.draft == 'none'
        with:
          tool: git-cliff@2.14.2

      # The notes between the markers in the merged pull request's description, without HTML
      # comments. prepare-release.yml writes them there for you to edit before merging. Empty,
      # scripts/changes.sh writes them from the pull requests the release branch brought in.
      # Also works out what the tag records: the kind (release or hotfix, from the branch name)
      # and, for a release, the dev commit it was cut from (the version commit's parent), which
      # the next release counts from whether this pull request was merged or squashed.
      - name: Release notes
        id: notes
        if: steps.version.outputs.released == 'true' && steps.version.outputs.draft == 'none'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh api "repos/${{ github.repository }}/commits/$SHA/pulls" > pulls.json
          jq -r '[.[] | select(.base.ref == "main")][0].body // ""' pulls.json > body.md
          head_ref=$(jq -r '[.[] | select(.base.ref == "main")][0].head.ref // ""' pulls.json)
          head_sha=$(jq -r '[.[] | select(.base.ref == "main")][0].head.sha // ""' pulls.json)
          number=$(jq -r '[.[] | select(.base.ref == "main")][0].number // ""' pulls.json)
          # The pull request's branch may be deleted already; GitHub keeps its head.
          if [ -n "$head_sha" ] && ! git cat-file -e "$head_sha^{commit}" 2>/dev/null; then
            git fetch -q origin "refs/pull/$number/head" || head_sha=
          fi
          branch=${head_sha:-$SHA}
          # No pull request found but a merge commit: what it merged is its second parent.
          if [ -z "$head_sha" ] && git rev-parse -q --verify "$SHA^2" >/dev/null; then branch=$(git rev-parse "$SHA^2"); fi
          case "$head_ref" in
            release/*) kind=release ;;
            hotfix/*) kind=hotfix ;;
            *) kind=other ;;
          esac
          cut=
          if [ "$kind" = release ]; then
            cut=$(git log --first-parent -1 --format=%P --grep="^chore: set version to $VERSION\$" "$branch" | cut -d' ' -f1)
          fi
          awk '/<!-- notes:start -->/ { on = 1; next } /<!-- notes:end -->/ { on = 0 } on' body.md \
            | perl -0pe 's/<!--.*?-->//gs' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "The pull request has no release notes; writing them from its changes."
            if [ "$kind" = hotfix ]; then
              prev=$(git tag --list 'v[0-9]*' | grep -v -- - | grep -vxF "$TAG" | sort -rV | head -n 1)
              sh scripts/changes.sh notes "$TAG" "$branch" "$prev" > notes.md
            else
              sh scripts/changes.sh notes "$TAG" "$branch" > notes.md
            fi
          fi
          cat notes.md
          echo "Kind $kind, cut from ${cut:-(none)}"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "cut=$cut" >> "$GITHUB_OUTPUT"

      # The tag first (the next release counts from it), then the draft on it. An annotated tag:
      # its message records the kind and the cut for scripts/changes.sh.
      - name: Tag and create the draft release
        if: steps.version.outputs.released == 'true' && steps.version.outputs.draft == 'none'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
          TAGGED: ${{ steps.version.outputs.tagged }}
          KIND: ${{ steps.notes.outputs.kind }}
          CUT: ${{ steps.notes.outputs.cut }}
        run: |
          if [ "$TAGGED" = false ]; then
            git config user.name "$BOT"
            git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" -m "kind: $KIND${CUT:+
          cut: $CUT}" "$SHA"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish:
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # install.sh and the in-app updaters only accept files listed here.
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Upload to the draft release and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"

  # Merge main back into dev with a normal merge commit: dev gets the version change and the
  # tag, so the next release branch (cut from dev) doesn't conflict with main on them and
  # git-cliff counts from the new tag. Runs as the release bot: admins can only change dev
  # through pull requests. Nothing runs on pushes to dev, so the merge starts no workflow.
  sync-dev:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge main into dev
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          # Retry if dev moves between fetch and push.
          for attempt in 1 2 3; do
            git fetch origin main dev
            git checkout -B dev origin/dev
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "dev already contains main"
              exit 0
            fi
            if ! git merge --no-ff --no-edit -m "chore: merge main into dev" origin/main; then
              git merge --abort
              # Both main and dev are protected, and a pull request's conflicts are resolved on
              # its head branch, so the pull request comes from a copy of main that can take
              # the resolution.
              branch="sync/main-into-dev-$(git rev-parse --short origin/main)"
              git push origin "origin/main:refs/heads/$branch"
              if [ -z "$(gh pr list --base dev --head "$branch" --json number --jq '.[].number')" ]; then
                printf '%s\n' \
                  "main doesn't merge cleanly into dev. Resolve the conflicts on this branch, then merge it into dev with a merge commit (not a squash), so the next release branch merges cleanly into main." \
                  "" \
                  "- On GitHub: **Resolve conflicts** below (it merges dev into \`$branch\` and commits the resolution there)." \
                  "- Or locally: \`git fetch && git switch $branch && git merge origin/dev\`, fix the conflicts, commit and push." \
                  > body.md
                gh pr create --base dev --head "$branch" --title "chore: merge main into dev" --body-file body.md
              fi
              echo "::warning::main doesn't merge cleanly into dev; opened a pull request from $branch to merge it by hand."
              exit 0
            fi
            if git push origin HEAD:dev; then
              exit 0
            fi
            echo "dev moved during the merge (attempt $attempt); retrying"
          done
          exit 1

      # A hotfix released while a release branch is open: both changed the version lines, so
      # the release pull request would conflict with main. Merge main into each open release
      # or hotfix branch, keeping that branch's version: merge with main's version in place
      # (so only real conflicts can remain), then put the branch's version back, as one
      # ordinary merge commit.
      - name: Merge main into open release branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git fetch origin main '+refs/heads/release/*:refs/remotes/origin/release/*' \
            '+refs/heads/hotfix/*:refs/remotes/origin/hotfix/*'
          main_version=$(git show origin/main:Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release refs/remotes/origin/hotfix); do
            branch=${ref#origin/}
            if git merge-base --is-ancestor origin/main "$ref" || git merge-base --is-ancestor "$ref" origin/main; then
              continue  # already has main, or already merged (released)
            fi
            version=$(git show "$ref:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
            if [ "$(printf '%s\n%s\n' "$version" "$main_version" | sort -V | tail -n 1)" != "$version" ] || \
               [ "$version" = "$main_version" ]; then
              echo "::warning::$branch ($version) isn't above the release on main ($main_version). Close its pull request, delete the branch and run Prepare release again."
              continue
            fi
            # A throwaway local commit with main's version; the pushed merge commit's parents
            # are the branch and main, so it never shows up.
            git checkout -q --detach "$ref"
            sh scripts/set-version.sh "$main_version"
            git commit -q -am "temporary: main's version"
            if ! git merge -q --no-commit --no-ff origin/main; then
              git merge --abort
              echo "::warning::main doesn't merge cleanly into $branch. Merge it there by hand (git switch $branch && git merge origin/main), keeping version $version."
              git checkout -q --detach origin/main
              continue
            fi
            sh scripts/set-version.sh "$version"
            git add -A
            commit=$(git commit-tree "$(git write-tree)" -p "$ref" -p origin/main -m "chore: merge main into $branch")
            git push origin "$commit:refs/heads/$branch"
            echo "Merged main into $branch (kept $version)"
            git reset -q --hard
            git checkout -q --detach origin/main
          done
