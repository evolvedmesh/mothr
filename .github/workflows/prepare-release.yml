name: Prepare release

# Run by hand: Actions → Prepare release → Run workflow (or `gh workflow run prepare-release.yml`
# with `-f kind=hotfix` for a hotfix). It opens the pull request that releases on merge:
#
#   release  cuts release/<x.y.z> from dev. scripts/changes.sh works out the version from the pull
#            requests merged since the last release (Conventional Commit titles; a patch/ pull
#            request counts as each of its commits) and writes the release notes.
#   hotfix   cuts hotfix/<x.y.z> from main with the next patch version. Open the fix pull
#            requests against that branch; the notes are written from them when it's merged.
#
# The branch gets one commit, the version (scripts/set-version.sh: Cargo.toml, Cargo.lock, and
# through them the phone app's versionName), and a pull request into main whose description
# holds the release notes: edit them there before merging. Fixes found while reviewing go into
# the branch as normal pull requests. Merging it (merge commit or squash) releases it
# (release.yml). Nothing else ever commits a version, so dev and main only change through
# pull requests.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: release (from dev) or hotfix (from main)
        type: choice
        options: [release, hotfix]
        default: release
      version:
        description: Version to release (x.y.z). Leave empty to work it out from the commits.
        type: string
        required: false

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      # The pull request has to start the checks, which a GITHUB_TOKEN-made one wouldn't.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kind == 'hotfix' && 'main' || 'dev' }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}


      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KIND: ${{ inputs.kind }}
          INPUT: ${{ inputs.version }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          if [ -n "$INPUT" ]; then
            next="v${INPUT#v}"
          elif [ "$KIND" = hotfix ]; then
            next=$(echo "$last" | awk -F. '{ printf "%s.%s.%d", $1, $2, $3 + 1 }')
          else
            next=$(sh scripts/changes.sh version)
            if [ -z "$next" ]; then
              echo "::error::dev has no feat, fix or perf changes since $last: nothing to release."
              exit 1
            fi
          fi
          version="${next#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$version isn't a stable x.y.z version."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released."
            exit 1
          fi
          branch="$KIND/$version"
          # Either kind: a hotfix and a release can work out the same version.
          if open=$(git ls-remote --exit-code --heads origin "release/$version" "hotfix/$version"); then
            echo "::error::${open##*refs/heads/} already exists. Finish or delete it first."
            exit 1
          fi
          echo "Last release $last; preparing $version on $branch"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Commit the version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git switch -c "$BRANCH"
          sh scripts/set-version.sh "$VERSION"
          git commit -am "chore: set version to $VERSION"
          git push origin "$BRANCH"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KIND: ${{ inputs.kind }}
          LAST: ${{ steps.version.outputs.last }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if [ "$KIND" = hotfix ]; then
            notes="<!-- Leave empty: the notes are written from the fix commits when this is merged. Or write them here. -->"
            intro="Hotfix **$VERSION** on top of $LAST. Open the fix pull requests against \`$BRANCH\`, then merge this."
          else
            notes=$(sh scripts/changes.sh notes "v$VERSION")
            intro="Release **$VERSION**: everything on \`dev\` since $LAST."
          fi
          cat > body.md <<EOF
          $intro

          ## Release notes

          These become the GitHub release's notes. Edit them before merging; if you empty this section, they're written from the commits.

          <!-- notes:start -->
          $notes
          <!-- notes:end -->

          ## Before merging

          - Fixes go into \`$BRANCH\` as normal pull requests. Add them to the notes above.
          - The \`build\` checks build every platform from this branch.
          - Merge it (merge commit or squash). Merging tags v$VERSION, builds, publishes the release and merges \`main\` back into \`dev\` (release.yml).
          EOF
          gh pr create --base main --head "$BRANCH" --title "chore: release $VERSION" --body-file body.md
