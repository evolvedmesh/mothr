name: PR title and checklist

# Two quick checks on the pull request itself, re-run whenever its title or description is
# edited. Both are required status checks on dev and main (the "mothr checks" repo ruleset).
# - pr-title: the title becomes the merged commit's message (merge and squash both use it), which
#   scripts/changes.sh reads for the next version and the release notes, so it has to be a Conventional Commit
#   (`feat(hub): …`, `fix(desktop,mobile): …`, `docs: …`).
# - pr-checklist: CI doesn't build the apps on feature pull requests, so the description must
#   tick the template's "both apps compile" boxes. The release bot's release and hotfix pull
#   requests are exempt: CI builds every platform on those.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The repo's types (AGENTS.md → Git workflow).
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          requireScope: false
          # Subjects are lowercase sentences in this repo ("add workspaces, …").
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Start the subject "{subject}" with a lowercase letter, like the rest of the history:
            "feat(hub): add workspaces", not "feat(hub): Add workspaces".

  pr-checklist:
    name: pr-checklist
    runs-on: ubuntu-24.04
    steps:
      - name: Both apps were compiled locally
        env:
          BODY: ${{ github.event.pull_request.body }}
          # Release and hotfix pull requests are opened by the release bot (prepare-release.yml)
          # and build every platform in CI (ci.yml → build) instead.
          RELEASE_PR: >-
            ${{ github.base_ref == 'main' && github.event.pull_request.user.type == 'Bot' &&
            (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')) }}
        run: |
          if [ "$RELEASE_PR" = true ]; then
            echo "Release pull request: the build checks compile every platform."
            exit 0
          fi
          missing=0
          for item in "Desktop app builds" "Phone app builds" "Tests pass" "Lint is clean"; do
            if ! grep -iE "^[[:space:]]*[-*][[:space:]]*\[[xX]\][[:space:]]*${item}" >/dev/null <<<"$BODY"; then
              echo "::error::Run and tick \"${item}\" in the pull request description (see the template)."
              missing=1
            fi
          done
          exit "$missing"
