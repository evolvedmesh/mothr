[package]
name = "mothr-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Remote client for a running Mothr desktop, shared with the mobile app through UniFFI."

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "mothr_client"

[dependencies]
mothr-core.workspace = true
mothr-update.workspace = true
anyhow.workspace = true
uniffi = "=0.29.4"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
futures.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
similar.workspace = true

[dev-dependencies]
mothr-remote.workspace = true
