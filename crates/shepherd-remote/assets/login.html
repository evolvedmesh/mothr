<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>Shepherd · Pair</title>
<style>
:root{--bg:#0f1115;--card:#171a20;--fg:#e8e6e3;--mut:#9aa0aa;--line:#2a2e36;--acc:#D97757;--err:#f87171}
@media (prefers-color-scheme:light){:root{--bg:#f6f5f2;--card:#fff;--fg:#1d1d1f;--mut:#6b6f76;--line:#e3e1dc;--err:#c0392b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{font-size:20px;margin:0 0 6px}
p{color:var(--mut);margin:0 0 18px;font-size:14px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.err{color:var(--err);font-size:14px;margin-bottom:12px;min-height:0}
.err:empty{display:none}
.logo{width:44px;height:44px;border-radius:12px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;margin-bottom:16px}
</style>
</head>
<body>
<form class="card" method="get" action="/" id="f">
  <div class="logo">S</div>
  <h1>Pair with Shepherd</h1>
  <p>Scan the QR code in Shepherd's settings, or paste the pairing token (or the whole pairing link) below.</p>
  <div class="err">{{MESSAGE}}</div>
  <input name="token" id="t" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Pairing token" required autofocus>
  <button type="submit">Connect</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  var input = document.getElementById('t'), v = input.value.trim(), m = v.match(/[?&]token=([^&#\s]+)/);
  if (m) { try { v = decodeURIComponent(m[1]); } catch (_) { v = m[1]; } }
  input.value = v;
});
</script>
</body>
</html>
